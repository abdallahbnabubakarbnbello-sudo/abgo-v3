<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABGO Islam V3</title>
<style>:root{--green:#0a5c36;--gold:#d4a017}*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f7fbf8}.header{background:var(--green);color:#fff;padding:18px;text-align:center}.tabs{display:flex;overflow-x:auto;background:#fff;position:sticky;top:0}.tab{padding:14px 18px;border:none;background:none;font-weight:700;border-bottom:3px solid transparent}.tab.active{border-color:var(--green);color:var(--green)}.page{padding:16px;max-width:900px;margin:0 auto;display:none}.page.active{display:block}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.05)}.btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prayer-item{display:flex;justify-content:space-between;padding:12px;background:#f0f7f2;border-radius:10px}.qibla-compass{width:220px;height:220px;border-radius:50%;border:8px solid var(--green);margin:20px auto;display:flex;align-items:center;justify-content:center}.arrow{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:90px solid var(--gold);transition:.6s}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0}.small{font-size:12px;color:#666}</style></head>
<body>
<div class="header"><h1>ABGO Islam V3</h1><p>Real Prayers • Qibla • Quran • Kano</p></div>
<div class="tabs"><button class="tab active" onclick="showTab('prayer',this)">Sallah</button><button class="tab" onclick="showTab('qibla',this)">Qibla</button><button class="tab" onclick="showTab('quran',this)">Quran</button><button class="tab" onclick="showTab('calendar',this)">Hijri</button><button class="tab" onclick="showTab('mosque',this)">Masallatai</button><button class="tab" onclick="showTab('names',this)">Sunayen Allah</button></div>
<div id="prayer" class="page active"><div class="card"><h3>Lokutan Sallah - Real</h3><p class="small" id="locStatus">Ana neman location...</p><div class="grid" id="prayerGrid"></div><p class="small" id="prayerDate"></p><button class="btn" onclick="loadPrayer()">Sabunta</button></div></div>
<div id="qibla" class="page"><div class="card" style="text-align:center"><h3>Qibla</h3><div class="qibla-compass"><div class="arrow" id="qiblaArrow"></div></div><p id="qiblaInfo">--°</p><button class="btn" onclick="loadQibla()">Nemo Qibla</button></div></div>
<div id="quran" class="page"><div class="card"><h3>Quran</h3><input id="qSearch" placeholder="Nema: mercy"><button class="btn" onclick="searchQuran()">Nema</button><select id="surahList" onchange="loadSurah(this.value)"><option>Loading...</option></select><div id="quranContent"></div></div></div>
<div id="calendar" class="page"><div class="card"><h3>Hijri</h3><div id="hijriInfo"></div><button class="btn" onclick="loadHijri()">Sabunta</button></div></div>
<div id="mosque" class="page"><div class="card"><h3>Masallatai (5km)</h3><div id="mosqueList"></div><button class="btn" onclick="loadMosques()">Nemo</button></div></div>
<div id="names" class="page"><div class="card"><h3>Asmaul Husna</h3><div id="namesList" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div></div>
<script>
let userPos=null;function showTab(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
function getPos(){return new Promise((res,rej)=>{navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),e=>rej(e),{enableHighAccuracy:true});});}
async function init(){try{const pos=await getPos();userPos=pos;document.getElementById('locStatus').textContent=pos.lat.toFixed(4)+","+pos.lon.toFixed(4);loadPrayer();loadSurahList();loadNames();}catch(e){userPos={lat:12.0022,lon:8.592};loadPrayer();loadSurahList();loadNames();}}
async function loadPrayer(){const r=await fetch(`/api/prayer?lat=${userPos.lat}&lon=${userPos.lon}&method=3`);const j=await r.json();if(j.data){document.getElementById('prayerDate').textContent=j.data.date.readable;document.getElementById('prayerGrid').innerHTML=Object.entries(j.data.timings).slice(0,6).map(([k,v])=>`<div class="prayer-item"><span>${k}</span><b>${v}</b></div>`).join('');}}
async function loadQibla(){const r=await fetch(`/api/qibla?lat=${userPos.lat}&lon=${userPos.lon}`);const j=await r.json();if(j.data){const d=j.data.direction;document.getElementById('qiblaInfo').textContent=d.toFixed(1)+'°';document.getElementById('qiblaArrow').style.transform=`rotate(${d}deg)`;}}
async function loadSurahList(){const r=await fetch('/api/quran/surahs');const j=await r.json();if(j.data){document.getElementById('surahList').innerHTML=j.data.map(s=>`<option value="${s.number}">${s.number}. ${s.englishName}</option>`).join('');}}
async function loadSurah(n){const r=await fetch(`/api/quran/surah/${n}`);const j=await r.json();if(j.arabic){let h=`<h3>${j.arabic.englishName}</h3>`;j.arabic.ayahs.forEach((a,i)=>{const tr=j.translation.ayahs[i]?.text||'';const au=j.audio.ayahs[i]?.audio||'';h+=`<div class="card"><div style="text-align:right;font-size:20px">${a.text}</div><p>${tr}</p>${au?`<audio controls src="${au}" style="width:100%"></audio>`:''}</div>`;});document.getElementById('quranContent').innerHTML=h;}}
async function searchQuran(){const q=document.getElementById('qSearch').value.trim();if(q.length<2)return;const r=await fetch(`/api/quran/search?q=${encodeURIComponent(q)}`);const j=await r.json();if(j.data&&j.data.matches){document.getElementById('quranContent').innerHTML=j.data.matches.slice(0,20).map(m=>`<div class="card"><b>${m.surah.englishName}</b><p>${m.text}</p></div>`).join('');}}
async function loadHijri(){const r=await fetch(`/api/hijri?lat=${userPos.lat}&lon=${userPos.lon}`);const j=await r.json();if(j.date){document.getElementById('hijriInfo').innerHTML=`<p>Hijri: ${j.date.hijri.date}</p><p>Miladi: ${j.date.gregorian.date}</p>`;}}
async function loadMosques(){document.getElementById('mosqueList').textContent='Ana nema...';const r=await fetch(`/api/mosques?lat=${userPos.lat}&lon=${userPos.lon}&radius=5000`);const j=await r.json();if(j.elements){document.getElementById('mosqueList').innerHTML=j.elements.slice(0,20).map(e=>`<div class="card"><b>${e.tags.name||'Masallaci'}</b><p>${e.lat||e.center?.lat},${e.lon||e.center?.lon}</p></div>`).join('');}}
async function loadNames(){const r=await fetch('/api/names');const j=await r.json();if(j.data){document.getElementById('namesList').innerHTML=j.data.map(n=>`<div class="card" style="text-align:center"><div>${n.name}</div><b>${n.transliteration}</b><p class="small">${n.en.meaning}</p></div>`).join('');}}
init();
</script></body></html>
